name: Tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run verifier regression tests
        run: python scripts/test_verify_deck.py
      - name: Run OMML conversion tests
        run: python scripts/test_omml_tex.py
